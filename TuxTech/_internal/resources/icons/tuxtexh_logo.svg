<svg xmlns="http://www.w3.org/2000/svg" viewBox="35 15 140 160" width="230" height="220">
  <defs>
    <!-- Degradado tecnológico principal (Cian a Azul Eléctrico) -->
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>

    <!-- Degradado naranja/dorado inspirado en el pico y patas de Tux -->
    <linearGradient id="tuxOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#FB8500" />
    </linearGradient>

    <!-- Degradado oscuro para el cuerpo del pingüino -->
    <linearGradient id="bodyDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B2D42" />
      <stop offset="100%" stop-color="#11131E" />
    </linearGradient>
  </defs>

  <!-- ================= ICONO: TUX TECH ================= -->
  <g transform="translate(10, 5)">
    <!-- Hexágono contenedor sutil de circuito -->
    <polygon points="85,5 155,45 155,125 85,165 15,125 15,45" fill="none" stroke="url(#techGrad)" stroke-width="3" opacity="0.35" />

    <!-- Líneas de circuito laterales -->
    <path d="M 15 65 L 0 65 L 0 45" fill="none" stroke="url(#techGrad)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="42" r="3.5" fill="#00F5D4" />
    
    <path d="M 155 105 L 170 105 L 170 125" fill="none" stroke="url(#techGrad)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="170" cy="128" r="3.5" fill="#0077B6" />

    <!-- Cuerpo del Pingüino -->
    <path d="M 85 24 C 52 24 38 56 38 98 C 38 134 56 150 85 150 C 114 150 132 134 132 98 C 132 56 118 24 85 24 Z" fill="url(#bodyDark)" stroke="url(#techGrad)" stroke-width="2" />

    <!-- Aletas laterales -->
    <path d="M 38 78 C 22 92 20 112 32 118 C 37 120 41 112 42 104 Z" fill="url(#bodyDark)" stroke="url(#techGrad)" stroke-width="1.5" />
    <path d="M 132 78 C 148 92 150 112 138 118 C 133 120 129 112 128 104 Z" fill="url(#bodyDark)" stroke="url(#techGrad)" stroke-width="1.5" />

    <!-- Panza blanca estilo Tux -->
    <path d="M 85 74 C 63 74 52 94 52 120 C 52 140 65 148 85 148 C 105 148 118 140 118 120 C 118 94 107 74 85 74 Z" fill="#F8F9FA" />

    <!-- Detalle de nodo/chip en el pecho -->
    <path d="M 85 95 L 85 112 M 76 104 L 94 104" stroke="#0077B6" stroke-width="2.5" stroke-linecap="round" opacity="0.25" />
    <circle cx="85" cy="104" r="3" fill="#0077B6" opacity="0.4" />

    <!-- Visor / Gafas Tech -->
    <rect x="52" y="46" width="66" height="20" rx="10" fill="#0B0E14" stroke="url(#techGrad)" stroke-width="2.5" />
    <!-- Ojos LED brillantes dentro del visor -->
    <circle cx="71" cy="56" r="4.5" fill="#00F5D4" />
    <circle cx="99" cy="56" r="4.5" fill="#00F5D4" />
    <!-- Brillo en los ojos -->
    <circle cx="72.5" cy="54.5" r="1.5" fill="#FFFFFF" />
    <circle cx="100.5" cy="54.5" r="1.5" fill="#FFFFFF" />

    <!-- Pico de Tux -->
    <path d="M 73 70 Q 85 66 97 70 Q 94 82 85 84 Q 76 82 73 70 Z" fill="url(#tuxOrange)" />

    <!-- Patas de Tux -->
    <path d="M 50 146 C 42 146 38 154 46 156 L 72 156 C 76 156 75 148 68 146 Z" fill="url(#tuxOrange)" />
    <path d="M 120 146 C 128 146 132 154 124 156 L 98 156 C 94 156 95 148 102 146 Z" fill="url(#tuxOrange)" />
  </g>
</svg>